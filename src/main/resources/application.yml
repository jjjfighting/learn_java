# ===================== 服务基础配置 =====================
server:
  port: 8080

spring:
  application:
    name: learn-student-backend
  # ===================== 数据源配置 =====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接学生管理系统数据库；serverTimezone 解决时区问题，allowPublicKeyRetrieval 适配 MySQL8 默认加密方式
    url: jdbc:mysql://localhost:3306/student_ms?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: admin    # TODO 改成你自己 MySQL 的 root 密码

# ===================== MyBatis-Plus 配置 =====================
mybatis-plus:
  configuration:
    # 数据库下划线字段(create_time) 自动映射为实体类驼峰属性(createTime)，默认就是 true，这里显式写出来便于理解
    map-underscore-to-camel-case: true
    # 控制台打印最终执行的 SQL 和参数，学习阶段调试非常方便（上线时应关掉）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：跟随数据库自增
      id-type: auto
      # 全局逻辑删除：所有表的 deleted 字段自动生效，删除变成 update deleted=1
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===================== 认证配置 =====================
auth:
  jwt:
    # HS256 签名密钥：要求至少 256 位（32 字符），生产环境务必换成随机生成的强密钥
    secret: StudentMs@2026#JwtSecretKeyForHmacSha256!
    # Token 有效期（分钟），过期后需重新登录
    expire-minutes: 120
